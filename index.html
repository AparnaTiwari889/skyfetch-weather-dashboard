<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFetch - Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ SkyFetch</h1>
        <p class="tagline">Your Personal Weather Dashboard</p>

        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name">
            <button id="search-btn">Search</button>
        </div>

        <!-- Recent Searches -->
        <div class="recent-searches">
            <h3>Recent Searches</h3>
            <div id="recent-container" class="recent-container"></div>
            <button id="clear-history" class="clear-btn">Clear History</button>
        </div>

        <!-- Weather Display -->
        <div id="weather-display">
            <p class="loading">Search for a city to see weather</p>
        </div>
    </div>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Your JavaScript -->
    <script src="app.js"></script>
</body>
</html>
